<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventos + GitHub Sync</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e5e7eb;
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --danger:#dc2626;
      --success:#059669;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:900px;
      margin:40px auto;
      padding:20px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px;
      box-shadow:0 8px 24px rgba(0,0,0,.04);
      margin-bottom:18px;
    }
    h1,h2{
      margin:0 0 14px 0;
    }
    .sub{
      color:var(--muted);
      margin-bottom:18px;
      line-height:1.5;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .full{grid-column:1 / -1}
    label{
      display:block;
      font-size:14px;
      font-weight:600;
      margin-bottom:6px;
    }
    input, textarea{
      width:100%;
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px 14px;
      font:inherit;
      outline:none;
      background:#fff;
    }
    textarea{min-height:90px; resize:vertical}
    input:focus, textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:16px;
    }
    button{
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font:inherit;
      font-weight:700;
      cursor:pointer;
    }
    .btn-primary{background:var(--primary); color:#fff;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-secondary{background:#eef2ff; color:var(--primary);}
    .btn-danger{background:#fee2e2; color:var(--danger);}
    .status{
      margin-top:12px;
      font-size:14px;
      color:var(--muted);
      min-height:22px;
    }
    .event{
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      margin-bottom:12px;
      background:#fff;
    }
    .event-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:8px;
    }
    .event h3{
      margin:0;
      font-size:18px;
    }
    .meta{
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }
    .small{
      font-size:12px;
      color:var(--muted);
    }
    @media (max-width:700px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test GitHub Eventos</title>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <h1>Eventos con guardado en GitHub</h1>
      <div class="sub">
        Esta página guarda los eventos en un archivo JSON dentro de tu repositorio.
        Rellena primero la configuración de GitHub.
      </div>

      <div class="grid">
        <div>
          <label for="owner">Usuario u organización</label>
          <input id="owner" placeholder="ej. xiscobarcelo">
        </div>
        <div>
          <label for="repo">Repositorio</label>
          <input id="repo" placeholder="ej. pool">
        </div>
        <div>
          <label for="branch">Rama</label>
          <input id="branch" placeholder="main" value="main">
        </div>
        <div>
          <label for="path">Ruta del archivo JSON</label>
          <input id="path" placeholder="app/eventos.json" value="app/campeonatos.json">
        </div>
        <div class="full">
          <label for="token">Token de GitHub</label>
          <input id="token" type="password" placeholder="ghp_... uZ0RbSf5moKj0skIIBE6qzcmXJhhZW3p7TlW">
          <div class="small">Se guarda localmente en tu navegador. No uses esto en una web pública.</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-secondary" id="saveConfigBtn">Guardar configuración</button>
        <button class="btn-secondary" id="loadBtn">Cargar eventos desde GitHub</button>
      </div>
      <div class="status" id="configStatus"></div>
    </div>

    <div class="card">
      <h2>Nuevo evento</h2>
      <div class="grid">
        <div class="full">
          <label for="title">Título</label>
          <input id="title" placeholder="Open Mallorca 9-Ball">
        </div>
        <div>
          <label for="date">Fecha</label>
          <input id="date" type="date">
        </div>
        <div>
          <label for="location">Lugar</label>
          <input id="location" placeholder="Palma">
        </div>
        <div class="full">
          <label for="notes">Notas</label>
          <textarea id="notes" placeholder="Formato, premios, horario..."></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" id="addEventBtn">Añadir evento</button>
        <button class="btn-primary" id="pushBtn">Guardar en GitHub</button>
        <button class="btn-danger" id="clearLocalBtn">Vaciar lista local</button>
      </div>
      <div class="status" id="eventStatus"></div>
    </div>

    <div class="card">
      <h2>Lista de eventos</h2>
      <div id="eventsList"></div>
    </div>
  </div>

  <script>
    const CONFIG_KEY = "github_events_config_v1";
    const LOCAL_EVENTS_KEY = "github_events_local_v1";

    let events = [];

    function $(id) {
      return document.getElementById(id);
    }

    function setStatus(id, msg, isError = false) {
      const el = $(id);
      el.textContent = msg;
      el.style.color = isError ? "#dc2626" : "#6b7280";
    }

    function saveConfigLocal() {
      const config = {
        owner: $("owner").value.trim(),
        repo: $("repo").value.trim(),
        branch: $("branch").value.trim() || "main",
        path: $("path").value.trim() || "app/eventos.json",
        token: $("token").value.trim()
      };
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
      setStatus("configStatus", "Configuración guardada en este navegador.");
    }

    function loadConfigLocal() {
      const raw = localStorage.getItem(CONFIG_KEY);
      if (!raw) return;
      try {
        const cfg = JSON.parse(raw);
        $("owner").value = cfg.owner || "";
        $("repo").value = cfg.repo || "";
        $("branch").value = cfg.branch || "main";
        $("path").value = cfg.path || "app/eventos.json";
        $("token").value = cfg.token || "";
      } catch (e) {
        console.error("Config corrupta:", e);
      }
    }

    function saveLocalEvents() {
      localStorage.setItem(LOCAL_EVENTS_KEY, JSON.stringify(events));
    }

    function loadLocalEvents() {
      const raw = localStorage.getItem(LOCAL_EVENTS_KEY);
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        events = Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.error("Eventos locales corruptos:", e);
        events = [];
      }
    }

    function renderEvents() {
      const list = $("eventsList");
      list.innerHTML = "";

      if (!events.length) {
        list.innerHTML = '<div class="meta">No hay eventos aún.</div>';
        return;
      }

      const sorted = [...events].sort((a, b) => a.date.localeCompare(b.date));

      for (const ev of sorted) {
        const div = document.createElement("div");
        div.className = "event";
        div.innerHTML = `
          <div class="event-top">
            <h3>${escapeHtml(ev.title)}</h3>
            <button class="btn-danger" data-id="${ev.id}" style="padding:8px 10px;font-size:13px;">Eliminar</button>
          </div>
          <div class="meta"><strong>Fecha:</strong> ${escapeHtml(ev.date)}</div>
          <div class="meta"><strong>Lugar:</strong> ${escapeHtml(ev.location)}</div>
          ${ev.notes ? `<div class="meta"><strong>Notas:</strong> ${escapeHtml(ev.notes)}</div>` : ""}
        `;
        list.appendChild(div);
      }

      list.querySelectorAll("button[data-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          events = events.filter(e => e.id !== id);
          saveLocalEvents();
          renderEvents();
          setStatus("eventStatus", "Evento eliminado de la lista local.");
        });
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getConfig() {
      return {
        owner: $("owner").value.trim(),
        repo: $("repo").value.trim(),
        branch: $("branch").value.trim() || "main",
        path: $("path").value.trim() || "app/eventos.json",
        token: $("token").value.trim()
      };
    }

    function validateConfig(cfg) {
      if (!cfg.owner || !cfg.repo || !cfg.branch || !cfg.path || !cfg.token) {
        throw new Error("Falta completar la configuración de GitHub.");
      }
    }

    function createPayload() {
      return {
        version: 1,
        updatedAt: new Date().toISOString(),
        events
      };
    }

    function toBase64Unicode(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    function fromBase64Unicode(str) {
      return decodeURIComponent(escape(atob(str)));
    }

    async function githubFetch(url, options = {}) {
      const cfg = getConfig();
      validateConfig(cfg);

      const res = await fetch(url, {
        ...options,
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${cfg.token}`,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(options.headers || {})
        }
      });

      if (!res.ok) {
        let detail = "";
        try {
          const data = await res.json();
          detail = data.message ? ` ${data.message}` : "";
        } catch (_) {}
        throw new Error(`GitHub respondió ${res.status}.${detail}`);
      }

      return res.json();
    }

    async function getRemoteFileMeta() {
      const cfg = getConfig();
      const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path}?ref=${encodeURIComponent(cfg.branch)}`;

      try {
        const data = await githubFetch(url, { method: "GET" });
        return data;
      } catch (error) {
        if (String(error.message).includes("404")) {
          return null;
        }
        throw error;
      }
    }

    async function loadFromGitHub() {
      setStatus("configStatus", "Cargando eventos desde GitHub...");
      const meta = await getRemoteFileMeta();

      if (!meta) {
        events = [];
        saveLocalEvents();
        renderEvents();
        setStatus("configStatus", "El archivo no existe aún en GitHub. Se creará al guardar.");
        return;
      }

      const decoded = fromBase64Unicode(meta.content.replace(/\n/g, ""));
      const data = JSON.parse(decoded);

      if (!data || !Array.isArray(data.events)) {
        throw new Error("El JSON remoto no tiene el formato esperado.");
      }

      events = data.events;
      saveLocalEvents();
      renderEvents();
      setStatus("configStatus", `Cargados ${events.length} evento(s) desde GitHub.`);
    }

    async function saveToGitHub() {
      setStatus("eventStatus", "Guardando en GitHub...");
      const cfg = getConfig();
      validateConfig(cfg);

      const existing = await getRemoteFileMeta();
      const payload = createPayload();
      const body = {
        message: `Actualizar eventos - ${new Date().toISOString()}`,
        content: toBase64Unicode(JSON.stringify(payload, null, 2)),
        branch: cfg.branch
      };

      if (existing && existing.sha) {
        body.sha = existing.sha;
      }

      const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path}`;

      await githubFetch(url, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      setStatus("eventStatus", `Guardado correcto en GitHub. Total: ${events.length} evento(s).`);
    }

    function addEvent() {
      const title = $("title").value.trim();
      const date = $("date").value;
      const location = $("location").value.trim();
      const notes = $("notes").value.trim();

      if (!title || !date || !location) {
        setStatus("eventStatus", "Completa título, fecha y lugar.", true);
        return;
      }

      events.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2),
        title,
        date,
        location,
        notes
      });

      saveLocalEvents();
      renderEvents();

      $("title").value = "";
      $("date").value = "";
      $("location").value = "";
      $("notes").value = "";

      setStatus("eventStatus", "Evento añadido a la lista local.");
    }

    function clearLocal() {
      if (!confirm("¿Vaciar la lista local?")) return;
      events = [];
      saveLocalEvents();
      renderEvents();
      setStatus("eventStatus", "Lista local vaciada.");
    }

    $("saveConfigBtn").addEventListener("click", saveConfigLocal);
    $("loadBtn").addEventListener("click", async () => {
      try {
        await loadFromGitHub();
      } catch (e) {
        console.error(e);
        setStatus("configStatus", e.message, true);
      }
    });

    $("addEventBtn").addEventListener("click", addEvent);
    $("pushBtn").addEventListener("click", async () => {
      try {
        saveConfigLocal();
        await saveToGitHub();
      } catch (e) {
        console.error(e);
        setStatus("eventStatus", e.message, true);
      }
    });
    $("clearLocalBtn").addEventListener("click", clearLocal);

    loadConfigLocal();
    loadLocalEvents();
    renderEvents();
  </script>
</body>
</html>
