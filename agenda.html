<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventos con GitHub Sync</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e5e7eb;
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --danger:#dc2626;
      --danger-bg:#fee2e2;
      --secondary:#eef2ff;
      --success:#059669;
      --shadow:0 10px 30px rgba(0,0,0,.06);
      --radius:18px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:960px;
      margin:40px auto;
      padding:20px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:22px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }

    h1,h2{
      margin:0 0 14px 0;
      line-height:1.2;
    }

    .sub{
      color:var(--muted);
      line-height:1.5;
      margin-bottom:18px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .full{grid-column:1 / -1}

    label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:6px;
    }

    input, textarea{
      width:100%;
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px 14px;
      font:inherit;
      background:#fff;
      outline:none;
    }

    textarea{
      min-height:96px;
      resize:vertical;
    }

    input:focus, textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:16px;
    }

    button{
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font:inherit;
      font-weight:700;
      cursor:pointer;
      transition:.18s ease;
    }

    button:hover{transform:translateY(-1px)}
    button:disabled{opacity:.65; cursor:not-allowed; transform:none}

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--primary-dark);
    }

    .btn-secondary{
      background:var(--secondary);
      color:var(--primary);
    }

    .btn-danger{
      background:var(--danger-bg);
      color:var(--danger);
    }

    .status{
      margin-top:12px;
      font-size:14px;
      min-height:20px;
      color:var(--muted);
    }

    .status.ok{color:var(--success)}
    .status.err{color:var(--danger)}

    .event{
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      margin-bottom:12px;
      background:#fff;
    }

    .event-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:10px;
    }

    .event h3{
      margin:0;
      font-size:18px;
      line-height:1.25;
    }

    .meta{
      font-size:14px;
      color:var(--muted);
      line-height:1.6;
    }

    .small{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
      line-height:1.4;
    }

    .pill{
      display:inline-block;
      padding:5px 10px;
      border-radius:999px;
      background:#f3f4f6;
      color:#374151;
      font-size:12px;
      font-weight:700;
      margin-bottom:8px;
    }

    .toolbar{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .count{
      font-size:14px;
      color:var(--muted);
      font-weight:700;
    }

    .empty{
      color:var(--muted);
      padding:16px 0;
    }

    @media (max-width:700px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Eventos con guardado en GitHub</h1>
      <div class="sub">
        Los datos de GitHub quedan guardados en este navegador. Solo tendrás que introducir el token una vez.
      </div>

      <div class="grid">
        <div>
          <label for="owner">Usuario u organización</label>
          <input id="owner" placeholder="ej. tu_usuario" />
        </div>
        <div>
          <label for="repo">Repositorio</label>
          <input id="repo" placeholder="ej. mi-repo" />
        </div>

        <div>
          <label for="branch">Rama</label>
          <input id="branch" value="main" placeholder="main" />
        </div>
        <div>
          <label for="path">Ruta del JSON</label>
          <input id="path" value="eventos.json" placeholder="eventos.json" />
        </div>

        <div class="full">
          <label for="token">Token de GitHub</label>
          <input id="token" type="password" placeholder="ghp_..." />
          <div class="small">
            Se guarda localmente en tu navegador. No uses esta solución así en una web pública.
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-secondary" id="testRepoBtn">Probar conexión</button>
        <button class="btn-secondary" id="loadBtn">Cargar desde GitHub</button>
      </div>

      <div class="status" id="configStatus"></div>
    </div>

    <div class="card">
      <h2>Nuevo evento</h2>

      <div class="grid">
        <div class="full">
          <label for="title">Título</label>
          <input id="title" placeholder="Ej. Open Mallorca 9-Ball" />
        </div>

        <div>
          <label for="date">Fecha</label>
          <input id="date" type="date" />
        </div>

        <div>
          <label for="location">Lugar</label>
          <input id="location" placeholder="Ej. Palma" />
        </div>

        <div class="full">
          <label for="notes">Notas</label>
          <textarea id="notes" placeholder="Horario, premios, formato..."></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" id="addEventBtn">Añadir evento</button>
        <button class="btn-primary" id="pushBtn">Guardar en GitHub</button>
        <button class="btn-danger" id="clearLocalBtn">Vaciar lista local</button>
      </div>

      <div class="status" id="eventStatus"></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2>Lista de eventos</h2>
        <div class="count" id="countLabel">0 eventos</div>
      </div>
      <div id="eventsList"></div>
    </div>
  </div>

  <script>
    const CONFIG_KEY = "github_events_config_v3";
    const LOCAL_EVENTS_KEY = "github_events_local_v3";

    // Puedes fijar estos valores para no tener que escribirlos nunca más
    const DEFAULT_CONFIG = {
      owner: "xiscobarcelo",
      repo: "pool",
      branch: "main",
      path: "app/campeonatos.json"
    };

    let events = [];

    function $(id) {
      return document.getElementById(id);
    }

    function setStatus(id, msg, type = "") {
      const el = $(id);
      el.textContent = msg;
      el.className = "status";
      if (type === "ok") el.classList.add("ok");
      if (type === "err") el.classList.add("err");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function saveConfigLocal() {
      const config = {
        owner: $("owner").value.trim(),
        repo: $("repo").value.trim(),
        branch: $("branch").value.trim() || "main",
        path: $("path").value.trim() || "eventos.json",
        token: $("token").value.trim()
      };
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    }

    function loadConfigLocal() {
      const raw = localStorage.getItem(CONFIG_KEY);

      if (raw) {
        try {
          const cfg = JSON.parse(raw);
          $("owner").value = cfg.owner || DEFAULT_CONFIG.owner;
          $("repo").value = cfg.repo || DEFAULT_CONFIG.repo;
          $("branch").value = cfg.branch || DEFAULT_CONFIG.branch;
          $("path").value = cfg.path || DEFAULT_CONFIG.path;
          $("token").value = cfg.token || "";
          return;
        } catch (e) {
          console.error("Error leyendo configuración local:", e);
        }
      }

      $("owner").value = DEFAULT_CONFIG.owner;
      $("repo").value = DEFAULT_CONFIG.repo;
      $("branch").value = DEFAULT_CONFIG.branch;
      $("path").value = DEFAULT_CONFIG.path;
    }

    function saveLocalEvents() {
      localStorage.setItem(LOCAL_EVENTS_KEY, JSON.stringify(events));
    }

    function loadLocalEvents() {
      const raw = localStorage.getItem(LOCAL_EVENTS_KEY);
      if (!raw) return;

      try {
        const parsed = JSON.parse(raw);
        events = Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.error("Error leyendo eventos locales:", e);
        events = [];
      }
    }

    function updateCount() {
      $("countLabel").textContent = `${events.length} evento${events.length === 1 ? "" : "s"}`;
    }

    function renderEvents() {
      const list = $("eventsList");
      list.innerHTML = "";

      updateCount();

      if (!events.length) {
        list.innerHTML = `<div class="empty">No hay eventos todavía.</div>`;
        return;
      }

      const sorted = [...events].sort((a, b) => {
        const da = a.date || "";
        const db = b.date || "";
        return da.localeCompare(db);
      });

      for (const ev of sorted) {
        const item = document.createElement("div");
        item.className = "event";

        item.innerHTML = `
          <div class="event-top">
            <div>
              <div class="pill">Evento</div>
              <h3>${escapeHtml(ev.title)}</h3>
            </div>
            <button class="btn-danger" data-id="${ev.id}" style="padding:8px 10px;font-size:13px;">Eliminar</button>
          </div>

          <div class="meta"><strong>Fecha:</strong> ${escapeHtml(ev.date || "-")}</div>
          <div class="meta"><strong>Lugar:</strong> ${escapeHtml(ev.location || "-")}</div>
          ${ev.notes ? `<div class="meta"><strong>Notas:</strong> ${escapeHtml(ev.notes)}</div>` : ""}
        `;

        list.appendChild(item);
      }

      list.querySelectorAll("button[data-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          events = events.filter(e => e.id !== id);
          saveLocalEvents();
          renderEvents();
          setStatus("eventStatus", "Evento eliminado de la lista local.", "ok");
        });
      });
    }

    function getConfig() {
      return {
        owner: $("owner").value.trim(),
        repo: $("repo").value.trim(),
        branch: $("branch").value.trim() || "main",
        path: $("path").value.trim() || "eventos.json",
        token: $("token").value.trim()
      };
    }

    function validateConfig(cfg) {
      if (!cfg.owner || !cfg.repo || !cfg.branch || !cfg.path || !cfg.token) {
        throw new Error("Completa owner, repo, branch, path y token.");
      }
    }

    function createEventId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function toBase64Unicode(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    function fromBase64Unicode(str) {
      return decodeURIComponent(escape(atob(str)));
    }

    async function ghFetch(url, options = {}) {
      const cfg = getConfig();
      validateConfig(cfg);

      const res = await fetch(url, {
        ...options,
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${cfg.token}`,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(options.headers || {})
        }
      });

      const text = await res.text();
      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch (_) {}

      console.log("URL:", url);
      console.log("STATUS:", res.status);
      console.log("BODY:", data || text);

      if (!res.ok) {
        const message = data && data.message ? data.message : text || "Error desconocido";
        throw new Error(`GitHub respondió ${res.status}. ${message}`);
      }

      return data;
    }

    async function testRepo() {
      try {
        const cfg = getConfig();
        validateConfig(cfg);

        setStatus("configStatus", "Probando conexión con GitHub...");

        const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`;
        const data = await ghFetch(url, { method: "GET" });

        setStatus("configStatus", `Conexión correcta. Repo encontrado: ${data.full_name}`, "ok");
      } catch (e) {
        console.error(e);
        setStatus("configStatus", e.message, "err");
      }
    }

    async function getFileMeta() {
      const cfg = getConfig();
      const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path}?ref=${encodeURIComponent(cfg.branch)}`;

      try {
        return await ghFetch(url, { method: "GET" });
      } catch (e) {
        if (String(e.message).includes("404")) {
          return null;
        }
        throw e;
      }
    }

    function normalizeRemoteData(data) {
      if (!data || !Array.isArray(data.events)) {
        throw new Error("El JSON remoto no tiene el formato esperado.");
      }
      return data.events;
    }

    function dedupeEvents(arr) {
      return Array.from(new Map(arr.map(ev => [ev.id, ev])).values());
    }

    async function loadFromGitHub() {
      try {
        setStatus("configStatus", "Cargando eventos desde GitHub...");

        const meta = await getFileMeta();

        if (!meta) {
          events = [];
          saveLocalEvents();
          renderEvents();
          setStatus("configStatus", "El archivo no existe todavía. Se creará al guardar.", "ok");
          return;
        }

        const decoded = fromBase64Unicode(meta.content.replace(/\n/g, ""));
        const data = JSON.parse(decoded);

        events = normalizeRemoteData(data);
        saveLocalEvents();
        renderEvents();

        setStatus("configStatus", `Cargados ${events.length} evento(s) desde GitHub.`, "ok");
      } catch (e) {
        console.error(e);
        setStatus("configStatus", e.message, "err");
      }
    }

    async function saveToGitHub() {
      try {
        const cfg = getConfig();
        validateConfig(cfg);

        setStatus("eventStatus", "Guardando en GitHub...");

        let remoteEvents = [];
        let sha = null;

        const remote = await getFileMeta();

        if (remote) {
          const decoded = fromBase64Unicode(remote.content.replace(/\n/g, ""));
          const data = JSON.parse(decoded);
          remoteEvents = normalizeRemoteData(data);
          sha = remote.sha || null;
        }

        const merged = dedupeEvents([...remoteEvents, ...events]);
        events = merged;
        saveLocalEvents();
        renderEvents();

        const payload = {
          version: 1,
          updatedAt: new Date().toISOString(),
          events
        };

        const body = {
          message: `Actualizar eventos - ${new Date().toISOString()}`,
          content: toBase64Unicode(JSON.stringify(payload, null, 2)),
          branch: cfg.branch
        };

        if (sha) body.sha = sha;

        const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path}`;

        await ghFetch(url, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        setStatus("eventStatus", `Guardado correcto en GitHub. Total: ${events.length} evento(s).`, "ok");
      } catch (e) {
        console.error(e);
        setStatus("eventStatus", e.message, "err");
      }
    }

    function addEvent() {
      const title = $("title").value.trim();
      const date = $("date").value;
      const location = $("location").value.trim();
      const notes = $("notes").value.trim();

      if (!title || !date || !location) {
        setStatus("eventStatus", "Completa título, fecha y lugar.", "err");
        return;
      }

      const event = {
        id: createEventId(),
        title,
        date,
        location,
        notes
      };

      events.push(event);
      events = dedupeEvents(events);
      saveLocalEvents();
      renderEvents();

      $("title").value = "";
      $("date").value = "";
      $("location").value = "";
      $("notes").value = "";

      setStatus("eventStatus", "Evento añadido a la lista local.", "ok");
    }

    function clearLocal() {
      const ok = confirm("¿Seguro que quieres vaciar la lista local?");
      if (!ok) return;

      events = [];
      saveLocalEvents();
      renderEvents();
      setStatus("eventStatus", "Lista local vaciada.", "ok");
    }

    $("testRepoBtn").addEventListener("click", testRepo);
    $("loadBtn").addEventListener("click", loadFromGitHub);
    $("addEventBtn").addEventListener("click", addEvent);
    $("pushBtn").addEventListener("click", async () => {
      saveConfigLocal();
      await saveToGitHub();
    });
    $("clearLocalBtn").addEventListener("click", clearLocal);

    // Guardado automático de configuración
    ["owner","repo","branch","path","token"].forEach(id => {
      $(id).addEventListener("input", saveConfigLocal);
    });

    loadConfigLocal();
    loadLocalEvents();
    renderEvents();

    // Carga automática al abrir
    window.addEventListener("load", async () => {
      const cfg = getConfig();

      if (!cfg.owner || !cfg.repo || !cfg.token) return;

      try {
        await loadFromGitHub();
      } catch (e) {
        console.log("Carga automática fallida");
      }
    });
  </script>
</body>
</html>
